<html>
  <head>
    <title>Area Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
    <div>
      <h1>Area Calculator</h1>
      <span><p>Square/Rectangle/Parallelogram:</p><input type="number" placeholder="Width" id="squareWidth"><p>x</p><input type="number" placeholder="Height" id="squareHeight"><p>=</p><p id="squareresult">...</p><button id="squareenter" onclick="calculateSquare()">Enter</button></span>
      <span><p>Triangle:</p><input type="number" placeholder="Base width" id="triangleWidth"><p>x</p><input type="number" placeholder="Height" id="triangleHeight"><p>=</p><p id="triangleresult">...</p><button id="triangleenter" onclick="calculateTriangle()">Enter</button></span>
      <span><p>Circle:</p><input type="number" placeholder="Radius" id="radius"><p>=</p><p id="circleresult">...</p><button id="circleenter" onclick="calculateCircle()">Enter</button></span>
    </div>
    <p>Created by Nihal Kompalli 2026</p>
  </body>
</html>
